# Environment correction only: explicit headless child JVMs; all workload gates unchanged.
# Predeclared packaged OCR workload study; written before any measurement in this study.
# Uncovered workload: explicit external-engine OCR through packaged JARs (earlier studies ran native text only).
# Profiles are fixed; outcomes (including typed failures and timeouts) are all retained.
profiles=historical-ocr-deu,historical-ocr-fraktur,historical-ocr-limit
historical-ocr-deu.source=/tmp/docweave-remaining21/packaged/historical-1835-container.pdf
historical-ocr-deu.sha256=d4800eb0ec74835b4ce184231b2028a5a5a5e165e5d3d316259a61cdb7561395
historical-ocr-deu.policy=TESSERACT:deu:300
historical-ocr-fraktur.source=/tmp/docweave-remaining21/packaged/historical-1835-container.pdf
historical-ocr-fraktur.sha256=d4800eb0ec74835b4ce184231b2028a5a5a5e165e5d3d316259a61cdb7561395
historical-ocr-fraktur.policy=TESSERACT:deu_latf:300
historical-ocr-limit.source=/tmp/docweave-remaining21/packaged/historical-1835-container.pdf
historical-ocr-limit.sha256=d4800eb0ec74835b4ce184231b2028a5a5a5e165e5d3d316259a61cdb7561395
historical-ocr-limit.policy=TESSERACT_LIMIT:deu:300
# Container: the frozen historical harness's own 1835 container (color-managed decode, 300 DPI); its PDFBox render
# reproduces source RGB 945b6c6776c4bd4ece0768b866505f3991818b50b27362a481d115b6f5749daf.
# Engine: tesseract 5.5.3 sha256 9c19bce33d5408d82d691e9827862da3276814033b32f5e5e3263175a3d8b917;
# deu 8407331d6aa0229dc927685c01a7938fc5a641d1a9524f74838cdac599f0d06e;
# deu_latf 429b8c33d37e1a4823a2bb082a644ff13e252f735b7945e08a518d22ddcc459e. OMP_THREAD_LIMIT=1 inherited.
processes=3
warmups=1
timed=2
concurrency=2
rounds=1
jvm_options=-Djava.awt.headless=true -Xms32m -Xmx256m -Ddocweave.study.tesseract=/tmp/docweave-tesseract-runtime/usr/bin/tesseract -Ddocweave.study.tessdata=/tmp/docweave-tesseract-runtime/usr/share/tessdata
process_deadline_seconds=180
# Declared gates (not latency targets; none are derived from observations):
gate.deadline=every child process exits within the deadline
gate.failures=historical-ocr-deu and historical-ocr-fraktur have zero failures; historical-ocr-limit fails every attempt with typed OCR_LIMIT
gate.determinism=every successful extraction of one profile yields the same logical-output SHA-256, across all child JVMs
gate.models=the deu and deu_latf profiles produce different logical outputs (each model is actually exercised)
gate.rss=Linux VmHWM of each child JVM below 512 MiB under -Xmx256m (declared operational ceiling, not a minimum)
scope=VmHWM covers only the child JVM; each OCR attempt also runs a separate native engine process whose memory is not included. A process deadline is not evidence that a running PDFBox render or engine call is interruptible.
latency_target=none declared; cold, warm sequential and concurrent wall times are recorded only
