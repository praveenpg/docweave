# Predeclared packaged success-path study; written before any measurement in this study.
# Profiles are fixed; outcomes (including typed failures and timeouts) are all retained.
profiles=nvidia-default,nvidia-partial-tables,magazine-oriented,magazine-default
nvidia-default.source=/tmp/docweave-nvidia-fy26q4/nvidia-fy26q4.pdf
nvidia-default.sha256=89de999d7155649197672bf490c519607f1abbcdc96e2e4c6718bf6ecbb13564
nvidia-default.policy=DEFAULT
nvidia-partial-tables.source=/tmp/docweave-nvidia-fy26q4/nvidia-fy26q4.pdf
nvidia-partial-tables.sha256=89de999d7155649197672bf490c519607f1abbcdc96e2e4c6718bf6ecbb13564
nvidia-partial-tables.policy=RULED_AND_PARTIAL_TEXT
magazine-oriented.source=/tmp/docweave-caption-negatives21/immunology-news-march-2025.pdf
magazine-oriented.sha256=fcbbb6b34a2d9c2b0b3acb546d0dc1ba100e7ed486d2dc7d3b0516fbdec03497
magazine-oriented.policy=ORIENTED_LINES
magazine-default.source=/tmp/docweave-caption-negatives21/immunology-news-march-2025.pdf
magazine-default.sha256=fcbbb6b34a2d9c2b0b3acb546d0dc1ba100e7ed486d2dc7d3b0516fbdec03497
magazine-default.policy=DEFAULT
# Schedule per profile: independent child JVM processes, each running the full sequence below.
processes=5
warmups=3
timed=10
concurrency=4
rounds=3
jvm_options=-Xms32m -Xmx256m
process_deadline_seconds=60
# Declared gates (not latency targets; none are derived from observations):
gate.deadline=every child process exits within the deadline
gate.failures=no unexpected outcome: success profiles have zero failures; magazine-default keeps its typed rejection
gate.determinism=every successful extraction of one profile yields the same logical-output SHA-256
gate.rss=Linux VmHWM below 512 MiB per child process under -Xmx256m (declared operational ceiling, not a minimum)
latency_target=none declared; cold, warm sequential and concurrent wall times are recorded only
